# ============================================================
# Training Configuration
# ============================================================

training:
  seed: 42
  device: "cuda"                  # cuda or cpu
  num_epochs: 100
  batch_size: 8
  num_workers: 4
  pin_memory: true
  gradient_clip: 1.0
  mixed_precision: true           # AMP for speed
  early_stopping_patience: 15

# Optimizer
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

# Scheduler
scheduler:
  name: "one_cycle_lr"
  max_lr: 1.0e-3
  pct_start: 0.3
  div_factor: 25
  final_div_factor: 1000

# Loss function
loss:
  primary: "smooth_l1"            # smooth_l1, mse, mae
  auxiliary:
    - name: "ssim"
      weight: 0.1
    - name: "edge_aware"
      weight: 0.05
  primary_weight: 0.85

# Data split
data_split:
  train: 0.70
  val: 0.15
  test: 0.15
  stratify_by: "zone"            # Split by Dhaka administrative zones

# Augmentation
augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: true
  rotate_90: true
  random_brightness: 0.2
  random_contrast: 0.2
  gaussian_noise: 0.01
  cutout: false

# Checkpointing
checkpoint:
  save_dir: "./models/checkpoints"
  save_top_k: 3
  monitor: "val_rmse"
  mode: "min"

# Logging
logging:
  use_mlflow: true
  use_wandb: false
  log_every_n_steps: 10
  val_every_n_epochs: 1
